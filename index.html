<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypuJLigę - Typowanie Lig Polskich</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        
        button:hover {
            background: #1b5e20;
            transform: translateY(-2px);
        }
        
        button.primary {
            background: #4caf50;
        }
        
        button.primary:hover {
            background: #2e7d32;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        
        .modal-content h2 {
            color: #1b5e20;
            margin-bottom: 20px;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #4caf50;
        }
        
        .leagues {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .league-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border-left: 5px solid #4caf50;
        }
        
        .league-card:hover {
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
            transform: translateY(-5px);
        }
        
        .league-card h3 {
            color: #1b5e20;
            margin-bottom: 10px;
        }
        
        .ranking-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #2e7d32;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .drag-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        
        .teams-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .team-item {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 5px;
            cursor: move;
            border: 2px solid #4caf50;
            text-align: center;
            transition: 0.2s;
        }
        
        .team-item:hover {
            background: #c8e6c9;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        
        .standings {
            background: #f5f5f5;
            border-radius: 5px;
            min-height: 400px;
            padding: 15px;
        }
        
        .position-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            border-left: 4px solid #4caf50;
        }
        
        .position-num {
            font-weight: bold;
            color: #1b5e20;
            min-width: 30px;
        }
        
        .error {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .success {
            color: #388e3c;
            padding: 15px;
            background: #c8e6c9;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 20px;
            }
            
            .leagues {
                grid-template-columns: 1fr;
            }
            
            .nav-buttons {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ TypuJLigę</h1>
            <p>Typuj końcowe tabele polskich lig piłkarskich</p>
            <div class="nav-buttons">
                <button onclick="showModal('loginModal')">Zaloguj się</button>
                <button onclick="showModal('registerModal')">Rejestracja</button>
                <button class="primary" id="adminBtn" style="display:none;" onclick="showAdminPanel()">Panel Admin</button>
                <button id="logoutBtn" style="display:none;" onclick="logout()">Wyloguj się</button>
            </div>
        </header>

        <div id="mainContent" style="display:none;">
            <div class="leagues" id="leaguesContainer"></div>
            
            <div id="leagueView" style="display:none;">
                <button onclick="backToLeagues()">← Powrót do lig</button>
                <div class="drag-container">
                    <h2 id="selectedLeague"></h2>
                    <p>Przeciągnij drużyny by ustawić ich końcową pozycję</p>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                        <div>
                            <h4>Dostępne drużyny</h4>
                            <div class="teams-list" id="availableTeams"></div>
                        </div>
                        <div>
                            <h4>Tabela końcowa</h4>
                            <div class="standings" id="standings"></div>
                        </div>
                    </div>
                    
                    <button class="primary" onclick="saveGuess()" style="margin-top: 20px;">Zapisz typowanie</button>
                </div>
            </div>
            
            <div id="rankingView" style="display:none;">
                <button onclick="backToLeagues()">← Powrót</button>
                <h2>Ranking użytkowników</h2>
                <div class="ranking-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Miejsce</th>
                                <th>Użytkownik</th>
                                <th>Punkty</th>
                                <th>Dokładne</th>
                            </tr>
                        </thead>
                        <tbody id="rankingBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Logowanie</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Hasło">
            <button class="primary" onclick="login()" style="width: 100%;">Zaloguj się</button>
            <button onclick="closeModal('loginModal')" style="width: 100%; margin-top: 10px;">Zamknij</button>
            <div id="loginError" class="error"></div>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2>Rejestracja</h2>
            <input type="text" id="registerName" placeholder="Nazwa użytkownika">
            <input type="email" id="registerEmail" placeholder="Email">
            <input type="password" id="registerPassword" placeholder="Hasło">
            <input type="password" id="registerPassword2" placeholder="Powtórz hasło">
            <button class="primary" onclick="register()" style="width: 100%;">Zarejestruj się</button>
            <button onclick="closeModal('registerModal')" style="width: 100%; margin-top: 10px;">Zamknij</button>
            <div id="registerError" class="error"></div>
        </div>
    </div>

    <script>
        // Mock data
        const leagues = [
            { id: 1, name: 'Ekstraklasa', teams: 18 },
            { id: 2, name: '1 Liga', teams: 20 },
            { id: 3, name: '2 Liga', teams: 20 },
            { id: 4, name: '3 Liga', teams: 20 }
        ];

        const mockTeams = {
            1: ['Legia Warszawa', 'Wisła Kraków', 'Piast Gliwice', 'Lech Poznań', 'Jagiellonia Białystok'],
            2: ['Zespół A', 'Zespół B', 'Zespół C', 'Zespół D', 'Zespół E'],
            3: ['Zespół Z1', 'Zespół Z2', 'Zespół Z3', 'Zespół Z4', 'Zespół Z5'],
            4: ['Zespół X1', 'Zespół X2', 'Zespół X3', 'Zespół X4', 'Zespół X5']
        };

        let currentUser = null;
        let currentLeague = null;

        function showModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                document.getElementById('loginError').textContent = 'Uzupełnij wszystkie pola';
                return;
            }
            
            currentUser = { email, name: 'Użytkownik' };
            closeModal('loginModal');
            showMainContent();
        }

        function register() {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const pass1 = document.getElementById('registerPassword').value;
            const pass2 = document.getElementById('registerPassword2').value;
            
            if (!name || !email || !pass1 || !pass2) {
                document.getElementById('registerError').textContent = 'Uzupełnij wszystkie pola';
                return;
            }
            
            if (pass1 !== pass2) {
                document.getElementById('registerError').textContent = 'Hasła nie są identyczne';
                return;
            }
            
            currentUser = { email, name };
            closeModal('registerModal');
            showMainContent();
        }

        function logout() {
            currentUser = null;
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('adminBtn').style.display = 'none';
        }

        function showMainContent() {
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            renderLeagues();
        }

        function renderLeagues() {
            const container = document.getElementById('leaguesContainer');
            container.innerHTML = leagues.map(league => `
                <div class="league-card" onclick="selectLeague(${league.id})">
                    <h3>${league.name}</h3>
                    <p>${league.teams} drużyn</p>
                    <button>Przejdź</button>
                </div>
            `).join('');
            
            document.getElementById('leagueView').style.display = 'none';
            document.getElementById('rankingView').style.display = 'none';
            document.getElementById('leaguesContainer').parentElement.style.display = 'grid';
        }

        function selectLeague(leagueId) {
            currentLeague = leagueId;
            const league = leagues.find(l => l.id === leagueId);
            document.getElementById('selectedLeague').textContent = league.name;
            
            const available = document.getElementById('availableTeams');
            available.innerHTML = mockTeams[leagueId].map(team => `
                <div class="team-item" draggable="true" ondragstart="dragStart(event)" data-team="${team}">
                    ${team}
                </div>
            `).join('');
            
            document.getElementById('leagueView').style.display = 'block';
            document.getElementById('leaguesContainer').parentElement.style.display = 'none';
            document.getElementById('rankingView').style.display = 'none';
        }

        function dragStart(e) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', e.target.innerHTML);
            e.target.style.opacity = '0.5';
        }

        function dragEnd(e) {
            e.target.style.opacity = '1';
        }

        function backToLeagues() {
            renderLeagues();
        }

        function saveGuess() {
            alert('Typowanie zapisane!');
        }

        function showAdminPanel() {
            alert('Panel administratora (w pełnej implementacji)');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => e.preventDefault());
        });
    </script>
</body>
</html>
